# ============================================================
# Render 后端部署配置
# Render 提供免费的 Web Service 托管（每月750小时）
# 文档：https://render.com/docs
# ============================================================

services:
  - type: web
    name: tiamo-backend
    runtime: docker
    repo: https://github.com/insper-y/tiamo-fullstack.git
    dockerfilePath: ./tiamo-backend/Dockerfile
    dockerContext: ./tiamo-backend
    branch: main
    plan: free
    healthCheckPath: /api/server-status
    autoDeploy: true
    envVars:
      - key: DB_URL
        value: jdbc:mysql://mysql-zeng80999-a9fd.d.aivencloud.com:12757/defaultdb?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        value: your-aiven-db-password
      - key: REDIS_HOST
        value: redis-12345.c258.us-east-1-4.ec2.cloud.redislabs.com
      - key: REDIS_PORT
        value: "12345"
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_SECRET
        value: tiamo-ai-secret-key-2024-must-be-at-least-256-bits-long-for-hs256
      - key: APP_LOG_EMAIL_ENABLED
        value: "false"
      - key: SPRING_MAIL_HOST
        value: smtp.qq.com
      - key: SPRING_MAIL_USERNAME
        value: 1301628876@qq.com
      - key: SPRING_MAIL_PASSWORD
        value: your-qq-mail-auth-code
      - key: APP_LOG_EMAIL_TO
        value: 1301628876@qq.com
