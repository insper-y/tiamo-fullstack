<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <title>控制台 - Tiamo AI 数据管理</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .dashboard-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .dashboard-header h1 {
            font-size: 24px; background: linear-gradient(135deg, var(--text-primary), var(--primary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; color: white; font-size: 16px;
        }
        .role-badge {
            padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500;
        }
        .role-admin { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .role-user { background: rgba(59, 130, 246, 0.2); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
        .logout-btn {
            padding: 8px 20px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer;
            font-size: 13px; transition: var(--transition); font-family: inherit;
        }
        .logout-btn:hover { background: var(--bg-input-focus); color: var(--error); border-color: var(--error); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px; transition: var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); border-color: var(--border-focus); }
        .stat-value { font-size: 32px; font-weight: 700; background: linear-gradient(135deg, var(--primary-light), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        /* 标签页导航 */
        .tabs-nav {
            display: flex; gap: 8px; margin-bottom: 20px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 8px;
        }
        .tab-btn {
            padding: 10px 24px; background: transparent; border: none;
            border-radius: var(--radius-md); color: var(--text-secondary);
            cursor: pointer; font-size: 14px; font-weight: 500; transition: var(--transition);
            font-family: inherit;
        }
        .tab-btn:hover { color: var(--text-primary); background: var(--bg-input); }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .data-card {
            background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px;
        }
        .data-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .data-card h2 { font-size: 18px; color: var(--text-primary); margin: 0; }
        .btn-primary {
            padding: 10px 20px; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; border-radius: var(--radius-md); color: white; cursor: pointer;
            font-size: 14px; font-weight: 500; transition: var(--transition); font-family: inherit;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-edit { background: linear-gradient(135deg, #0ea5e9, #0284c7); margin-right: 6px; }
        .btn-edit:hover { box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4); }
        .btn-delete { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-delete:hover { box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
        .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .data-table th { text-align: left; padding: 12px; color: var(--text-secondary); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        .data-table td { padding: 12px; border-bottom: 1px solid var(--border); color: var(--text-primary); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .data-table tr:hover { background: var(--bg-input); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
        .token-info {
            background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 16px; font-size: 12px; color: var(--text-secondary); word-break: break-all;
            font-family: monospace; margin-top: 16px;
        }
        .token-info strong { color: var(--primary-light); }
        /* 弹窗样式 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); z-index: 1000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
            width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 24px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; color: var(--text-primary); margin: 0; }
        .modal-close {
            background: none; border: none; color: var(--text-secondary); cursor: pointer;
            font-size: 24px; line-height: 1; padding: 4px; transition: var(--transition);
        }
        .modal-close:hover { color: var(--error); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group-full { grid-column: 1 / -1; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        .btn-cancel {
            padding: 10px 20px; background: var(--bg-input); border: 1px solid var(--border);
            border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer;
            font-size: 14px; transition: var(--transition); font-family: inherit;
        }
        .btn-cancel:hover { background: var(--bg-input-focus); }
        .table-wrapper { overflow-x: auto; }
        @media (max-width: 600px) {
            .dashboard-header { flex-direction: column; gap: 16px; text-align: center; }
            .data-table { font-size: 12px; }
            .data-table th, .data-table td { padding: 8px; }
            .form-grid { grid-template-columns: 1fr; }
            .tabs-nav { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="ai-bg">
        <div class="grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <canvas id="particles"></canvas>
    </div>
    <div class="dashboard-container">
        <!-- 顶部导航 -->
        <div class="dashboard-header">
            <h1>Tiamo AI 控制台</h1>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">A</div>
                <div>
                    <div style="font-size:14px;font-weight:500;" id="userNickname">加载中...</div>
                    <div style="font-size:12px;color:var(--text-muted);" id="userEmail"></div>
                </div>
                <span class="role-badge" id="roleBadge">普通用户</span>
                <button class="logout-btn" id="logBtn" style="color:var(--primary-light);display:none;">操作日志</button>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>
        <!-- 提示消息 -->
        <div class="alert" id="alert">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <span class="alert-text"></span>
        </div>
        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="bookCount">--</div>
                <div class="stat-label">商品数据总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="userCount">--</div>
                <div class="stat-label">当前用户ID</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="roleStat">用户</div>
                <div class="stat-label">当前角色</div>
            </div>
        </div>
        <!-- 标签页导航（仅管理员可见） -->
        <div class="tabs-nav" id="tabsNav" style="display:none;">
            <button class="tab-btn active" onclick="switchTab('users')">用户列表</button>
            <button class="tab-btn" onclick="switchTab('books')">商品数据</button>
        </div>
        <!-- 用户列表标签页（仅管理员可见） -->
        <div class="tab-content" id="usersTab">
            <div class="data-card">
                <div class="data-card-header">
                    <h2>用户列表（仅管理员可见）</h2>
                    <button class="btn-primary" onclick="loadUserList()">刷新</button>
                </div>
                <div class="table-wrapper">
                    <div id="userList">
                        <div class="empty-state">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 商品数据标签页 -->
        <div class="tab-content active" id="booksTab">
            <div class="data-card">
                <div class="data-card-header">
                    <h2>商品数据列表</h2>
                    <button class="btn-primary" onclick="openAddModal()">+ 新增商品</button>
                </div>
                <div class="table-wrapper">
                    <div id="bookList">
                        <div class="empty-state">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Token 信息 -->
        <div class="data-card">
            <h2>当前 Token 信息</h2>
            <div class="token-info" id="tokenInfo">加载中...</div>
        </div>
        <!-- 数据导出 -->
        <div class="data-card">
            <div class="data-card-header">
                <h2>数据导出（CSV格式）</h2>
            </div>
            <div style="margin-bottom:16px;">
                <label style="display:block;color:var(--text-secondary);font-size:13px;margin-bottom:6px;">接收邮箱</label>
                <input type="email" id="exportEmail" class="form-input" placeholder="请输入接收邮箱" style="max-width:400px;">
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
                <button class="btn-primary" onclick="downloadUsers()" style="background:linear-gradient(135deg,#10b981,#059669);">
                    下载用户列表
                </button>
                <button class="btn-primary" onclick="downloadBooks()" style="background:linear-gradient(135deg,#0ea5e9,#0284c7);">
                    下载商品数据
                </button>
                <button class="btn-primary" onclick="downloadLogs()" style="background:linear-gradient(135deg,#f59e0b,#d97706);">
                    下载操作日志
                </button>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <button class="btn-primary" onclick="sendUsersToEmail()" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);">
                    发送用户列表到邮箱
                </button>
                <button class="btn-primary" onclick="sendBooksToEmail()" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);">
                    发送商品数据到邮箱
                </button>
                <button class="btn-primary" onclick="sendLogsToEmail()" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);">
                    发送操作日志到邮箱
                </button>
            </div>
            <p style="color:var(--text-muted);font-size:12px;margin-top:12px;">
                提示：用户列表和操作日志仅管理员可操作；CSV文件可用Excel打开，UTF-8编码。
            </p>
        </div>

        <!-- 邮件配置（仅管理员可见） -->
        <div class="data-card" id="emailConfigCard" style="display:none;">
            <div class="data-card-header">
                <h2>邮件通知配置</h2>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div>
                    <label style="display:block;color:var(--text-secondary);font-size:13px;margin-bottom:6px;">日报发送时间（HH:mm）</label>
                    <input type="time" id="configSendTime" class="form-input">
                </div>
                <div>
                    <label style="display:block;color:var(--text-secondary);font-size:13px;margin-bottom:6px;">收件邮箱</label>
                    <input type="email" id="configToEmail" class="form-input">
                </div>
                <div>
                    <label style="display:block;color:var(--text-secondary);font-size:13px;margin-bottom:6px;">日报邮件通知</label>
                    <select id="configDailyEnabled" class="form-input">
                        <option value="true">开启</option>
                        <option value="false">关闭</option>
                    </select>
                </div>
                <div>
                    <label style="display:block;color:var(--text-secondary);font-size:13px;margin-bottom:6px;">实时操作日志邮件</label>
                    <select id="configRealTimeEnabled" class="form-input">
                        <option value="true">开启</option>
                        <option value="false">关闭</option>
                    </select>
                </div>
            </div>
            <div style="margin-top:16px;">
                <button class="btn-primary" onclick="saveEmailConfig()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);">
                    保存配置
                </button>
            </div>
            <p style="color:var(--text-muted);font-size:12px;margin-top:12px;">
                提示：修改发送时间后，系统将在每天指定时间自动发送操作日志日报邮件。
            </p>
        </div>
        <div class="copyright" style="margin-top:24px;">
            &copy; 2026 Tiamo AI. All rights reserved.
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div class="modal-overlay" id="bookModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">新增商品</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="bookForm">
                <input type="hidden" id="bookId">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="name">分销软件</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" id="name" name="name" placeholder="请输入分销软件名称">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="type">微信账号</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" id="type" name="type" placeholder="请输入微信账号">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="description">软件账号</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" id="description" name="description" placeholder="请输入软件账号">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="aa">微信备注名</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" id="aa" name="aa" placeholder="请输入微信备注名">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="bd">商品ID</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" id="bd" name="bd" placeholder="请输入商品ID">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="ax">商品标题</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" id="ax" name="ax" placeholder="请输入商品标题">
                        </div>
                    </div>
                    <div class="form-group form-group-full">
                        <label class="form-label" for="ac">商品链接</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" id="ac" name="ac" placeholder="请输入商品链接">
                        </div>
                    </div>
                    <div class="form-group form-group-full">
                        <label class="form-label" for="ab">商品主图</label>
                        <div class="input-wrapper">
                            <input type="text" class="form-input" id="ab" name="ab" placeholder="请输入商品主图URL">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                    <button type="button" class="btn-primary" id="saveBtn" onclick="saveBook()">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal" style="max-width:400px;">
            <div class="modal-header">
                <h3>确认删除</h3>
                <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
            </div>
            <p style="color:var(--text-secondary);margin-bottom:20px;">确定要删除这条商品数据吗？此操作不可恢复。</p>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeDeleteModal()">取消</button>
                <button type="button" class="btn-primary btn-delete" onclick="confirmDelete()">确认删除</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // 检查登录状态
        if (!Auth.requireAuth()) {
            throw new Error('未登录');
        }
        var user = Auth.getUser();
        var currentDeleteId = null;
        var bookList = [];
        var isAdmin = user && user.role === 1;
        // 显示用户信息
        document.getElementById('userNickname').textContent = user ? (user.nickname || user.username) : '未知';
        document.getElementById('userEmail').textContent = user ? (user.email || '') : '';
        document.getElementById('userAvatar').textContent = user ? (user.nickname || user.username).charAt(0).toUpperCase() : '?';
        document.getElementById('userCount').textContent = user ? user.userId : '--';
        // 显示角色
        var roleBadge = document.getElementById('roleBadge');
        var roleStat = document.getElementById('roleStat');
        if (isAdmin) {
            roleBadge.textContent = '管理员';
            roleBadge.className = 'role-badge role-admin';
            roleStat.textContent = '管理员';
            // 管理员显示标签页导航和操作日志按钮
            document.getElementById('tabsNav').style.display = 'flex';
            document.getElementById('logBtn').style.display = 'inline-block';
            document.getElementById('logBtn').onclick = function() { window.location.href = 'logs.html'; };
            // 默认显示用户列表标签页
            switchTab('users');
        } else {
            roleBadge.textContent = '普通用户';
            roleBadge.className = 'role-badge role-user';
            roleStat.textContent = '普通用户';
            // 普通用户只显示商品数据
            document.getElementById('tabsNav').style.display = 'none';
            document.getElementById('logBtn').style.display = 'none';
            switchTab('books');
        }
        // 加载邮件配置（仅管理员可见）
        loadEmailConfig();
        // 显示 Token
        var token = Auth.getToken();
        document.getElementById('tokenInfo').innerHTML =
            '<strong>Token:</strong> ' + token.substring(0, 50) + '...' +
            '<br><br><strong>长度:</strong> ' + token.length + ' 字符' +
            '<br><strong>存储位置:</strong> localStorage';
        // 切换标签页
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
            document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
            document.getElementById(tabName + 'Tab').classList.add('active');
            var activeBtn = document.querySelector('.tab-btn[onclick="switchTab(\'' + tabName + '\')"]');
            if (activeBtn) activeBtn.classList.add('active');
            if (tabName === 'users' && isAdmin) {
                loadUserList();
            } else if (tabName === 'books') {
                loadBooks();
            }
        }
        // 加载用户列表（仅管理员）
        function loadUserList() {
            if (!isAdmin) return;
            Api.getUserList().then(function(res) {
                var listEl = document.getElementById('userList');
                if (res.code === 200 && res.data) {
                    if (res.data.length === 0) {
                        listEl.innerHTML = '<div class="empty-state">暂无用户</div>';
                        return;
                    }
                    var html = '<table class="data-table"><thead><tr>' +
                        '<th>ID</th><th>用户名</th><th>昵称</th><th>邮箱</th><th>手机号</th><th>角色</th><th>状态</th><th>注册时间</th>' +
                        '</tr></thead><tbody>';
                    res.data.forEach(function(item) {
                        html += '<tr>' +
                            '<td>' + item.id + '</td>' +
                            '<td>' + (item.username || '-') + '</td>' +
                            '<td>' + (item.nickname || '-') + '</td>' +
                            '<td>' + (item.email || '-') + '</td>' +
                            '<td>' + (item.phone || '-') + '</td>' +
                            '<td><span class="role-badge ' + (item.role === 1 ? 'role-admin' : 'role-user') + '">' + (item.roleName || '普通用户') + '</span></td>' +
                            '<td>' + (item.statusName || '-') + '</td>' +
                            '<td>' + (item.createTime || '-') + '</td>' +
                            '</tr>';
                    });
                    html += '</tbody></table>';
                    listEl.innerHTML = html;
                } else if (res.code === 403) {
                    listEl.innerHTML = '<div class="empty-state" style="color:var(--error);">无权限访问</div>';
                } else {
                    listEl.innerHTML = '<div class="empty-state">' + (res.msg || '加载失败') + '</div>';
                }
            });
        }
        // 加载商品列表
        function loadBooks() {
            Api.getBooks().then(function (res) {
                var listEl = document.getElementById('bookList');
                if (res.code === 20041 && res.data) {
                    bookList = res.data;
                    document.getElementById('bookCount').textContent = res.data.length;
                    if (res.data.length === 0) {
                        listEl.innerHTML = '<div class="empty-state">暂无数据，点击右上角"新增商品"添加</div>';
                        return;
                    }
                    var html = '<table class="data-table"><thead><tr>' +
                        '<th>ID</th><th>分销软件</th><th>微信账号</th><th>软件账号</th>' +
                        '<th>微信备注</th><th>商品ID</th><th>商品标题</th><th>操作</th>' +
                        '</tr></thead><tbody>';
                    res.data.forEach(function (item) {
                        html += '<tr>' +
                            '<td>' + item.id + '</td>' +
                            '<td>' + (item.name || '-') + '</td>' +
                            '<td>' + (item.type || '-') + '</td>' +
                            '<td>' + (item.description || '-') + '</td>' +
                            '<td>' + (item.aa || '-') + '</td>' +
                            '<td>' + (item.bd || '-') + '</td>' +
                            '<td title="' + (item.ax || '') + '">' + (item.ax || '-') + '</td>' +
                            '<td style="white-space:nowrap;">' +
                                '<button class="btn-primary btn-sm btn-edit" onclick="openEditModal(' + item.id + ')">编辑</button>' +
                                '<button class="btn-primary btn-sm btn-delete" onclick="openDeleteModal(' + item.id + ')">删除</button>' +
                            '</td>' +
                            '</tr>';
                    });
                    html += '</tbody></table>';
                    listEl.innerHTML = html;
                } else if (res.httpStatus === 401) {
                    listEl.innerHTML = '<div class="empty-state" style="color:var(--error);">Token已过期，请重新登录</div>';
                    AuthUtils.showAlert('error', 'Token已过期，请重新登录');
                    setTimeout(function () { logout(); }, 2000);
                } else {
                    listEl.innerHTML = '<div class="empty-state">' + (res.msg || '加载失败') + '</div>';
                }
            });
        }
        // 打开新增弹窗
        function openAddModal() {
            document.getElementById('modalTitle').textContent = '新增商品';
            document.getElementById('bookForm').reset();
            document.getElementById('bookId').value = '';
            document.getElementById('bookModal').classList.add('active');
        }
        // 打开编辑弹窗
        function openEditModal(id) {
            var item = bookList.find(function (b) { return b.id === id; });
            if (!item) {
                AuthUtils.showAlert('error', '未找到该商品数据，请刷新页面后重试');
                return;
            }
            document.getElementById('modalTitle').textContent = '编辑商品';
            document.getElementById('bookId').value = item.id;
            document.getElementById('name').value = item.name || '';
            document.getElementById('type').value = item.type || '';
            document.getElementById('description').value = item.description || '';
            document.getElementById('aa').value = item.aa || '';
            document.getElementById('bd').value = item.bd || '';
            document.getElementById('ac').value = item.ac || '';
            document.getElementById('ab').value = item.ab || '';
            document.getElementById('ax').value = item.ax || '';
            document.getElementById('bookModal').classList.add('active');
        }
        // 关闭弹窗
        function closeModal() {
            document.getElementById('bookModal').classList.remove('active');
        }
        // 保存商品
        function saveBook() {
            var id = document.getElementById('bookId').value;
            var data = {
                name: document.getElementById('name').value,
                type: document.getElementById('type').value,
                description: document.getElementById('description').value,
                aa: document.getElementById('aa').value,
                bd: document.getElementById('bd').value,
                ac: document.getElementById('ac').value,
                ab: document.getElementById('ab').value,
                ax: document.getElementById('ax').value
            };
            var saveBtn = document.getElementById('saveBtn');
            var originalText = saveBtn.textContent;
            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            var promise;
            if (id) {
                data.id = parseInt(id);
                promise = Api.updateBook(data);
            } else {
                promise = Api.addBook(data);
            }
            promise.then(function (res) {
                saveBtn.disabled = false;
                saveBtn.textContent = originalText;
                if (res.code === 20011 || res.code === 20031) {
                    AuthUtils.showAlert('success', id ? '修改成功！' : '新增成功！');
                    closeModal();
                    loadBooks();
                } else {
                    AuthUtils.showAlert('error', res.msg || '保存失败，请稍后重试');
                }
            }).catch(function (err) {
                saveBtn.disabled = false;
                saveBtn.textContent = originalText;
                AuthUtils.showAlert('error', '网络请求失败，请检查后端服务');
                console.error('保存失败:', err);
            });
        }
        // 打开删除确认弹窗
        function openDeleteModal(id) {
            currentDeleteId = id;
            document.getElementById('deleteModal').classList.add('active');
        }
        // 关闭删除弹窗
        function closeDeleteModal() {
            currentDeleteId = null;
            document.getElementById('deleteModal').classList.remove('active');
        }
        // 确认删除
        function confirmDelete() {
            if (currentDeleteId) {
                Api.deleteBook(currentDeleteId).then(function (res) {
                    if (res.code === 20021) {
                        AuthUtils.showAlert('success', '删除成功！');
                        closeDeleteModal();
                        loadBooks();
                    } else {
                        AuthUtils.showAlert('error', res.msg || '删除失败，请稍后重试');
                    }
                }).catch(function (err) {
                    AuthUtils.showAlert('error', '网络请求失败，请检查后端服务');
                    console.error('删除失败:', err);
                });
            }
        }
        // 退出登录
        function logout() {
            Auth.logout();
            window.location.href = 'login.html';
        }
        // 下载用户列表
        function downloadUsers() {
            AuthUtils.showAlert('success', '正在下载用户列表...');
            Api.downloadUsers().then(function (res) {
                if (res.success) {
                    AuthUtils.showAlert('success', '用户列表下载成功: ' + res.filename);
                } else {
                    AuthUtils.showAlert('error', res.msg || '下载失败，可能无管理员权限');
                }
            });
        }
        // 下载商品数据
        function downloadBooks() {
            AuthUtils.showAlert('success', '正在下载商品数据...');
            Api.downloadBooks().then(function (res) {
                if (res.success) {
                    AuthUtils.showAlert('success', '商品数据下载成功: ' + res.filename);
                } else {
                    AuthUtils.showAlert('error', res.msg || '下载失败');
                }
            });
        }
        // 下载操作日志
        function downloadLogs() {
            AuthUtils.showAlert('success', '正在下载操作日志...');
            Api.downloadLogs().then(function (res) {
                if (res.success) {
                    AuthUtils.showAlert('success', '操作日志下载成功: ' + res.filename);
                } else {
                    AuthUtils.showAlert('error', res.msg || '下载失败，可能无管理员权限');
                }
            });
        }

        // 获取邮箱地址
        function getExportEmail() {
            var email = document.getElementById('exportEmail').value.trim();
            if (!email) {
                AuthUtils.showAlert('error', '请先输入接收邮箱');
                return null;
            }
            return email;
        }

        // 发送用户列表到邮箱
        function sendUsersToEmail() {
            var email = getExportEmail();
            if (!email) return;
            AuthUtils.showAlert('success', '正在发送用户列表到邮箱...');
            Api.exportUsersToEmail(email).then(function (res) {
                if (res.code === 200) {
                    AuthUtils.showAlert('success', res.msg || '发送成功');
                } else {
                    AuthUtils.showAlert('error', res.msg || '发送失败，可能无管理员权限');
                }
            });
        }

        // 发送商品数据到邮箱
        function sendBooksToEmail() {
            var email = getExportEmail();
            if (!email) return;
            AuthUtils.showAlert('success', '正在发送商品数据到邮箱...');
            Api.exportBooksToEmail(email).then(function (res) {
                if (res.code === 200) {
                    AuthUtils.showAlert('success', res.msg || '发送成功');
                } else {
                    AuthUtils.showAlert('error', res.msg || '发送失败');
                }
            });
        }

        // 发送操作日志到邮箱
        function sendLogsToEmail() {
            var email = getExportEmail();
            if (!email) return;
            AuthUtils.showAlert('success', '正在发送操作日志到邮箱...');
            Api.exportLogsToEmail(email).then(function (res) {
                if (res.code === 200) {
                    AuthUtils.showAlert('success', res.msg || '发送成功');
                } else {
                    AuthUtils.showAlert('error', res.msg || '发送失败，可能无管理员权限');
                }
            });
        }

        // 加载邮件配置（仅管理员）
        function loadEmailConfig() {
            var userInfo = Auth.getUser();
            if (!userInfo || userInfo.role !== 1) {
                return;
            }
            // 显示邮件配置面板
            document.getElementById('emailConfigCard').style.display = 'block';
            Api.getEmailConfig().then(function (res) {
                if (res.code === 200 && res.data) {
                    document.getElementById('configSendTime').value = res.data.sendTime || '20:00';
                    document.getElementById('configToEmail').value = res.data.toEmail || '';
                    document.getElementById('configDailyEnabled').value = (res.data.enabled === false || res.data.enabled === 'false') ? 'false' : 'true';
                    document.getElementById('configRealTimeEnabled').value = (res.data.realTimeEnabled === false || res.data.realTimeEnabled === 'false') ? 'false' : 'true';
                    // 同时填充导出邮箱
                    document.getElementById('exportEmail').value = res.data.toEmail || '';
                }
            });
        }

        // 保存邮件配置
        function saveEmailConfig() {
            var config = {
                sendTime: document.getElementById('configSendTime').value,
                toEmail: document.getElementById('configToEmail').value,
                enabled: document.getElementById('configDailyEnabled').value,
                realTimeEnabled: document.getElementById('configRealTimeEnabled').value
            };
            AuthUtils.showAlert('success', '正在保存配置...');
            Api.updateEmailConfig(config).then(function (res) {
                if (res.code === 200) {
                    AuthUtils.showAlert('success', '配置保存成功');
                    // 同步更新导出邮箱
                    document.getElementById('exportEmail').value = config.toEmail;
                } else {
                    AuthUtils.showAlert('error', res.msg || '保存失败');
                }
            });
        }
        // 点击弹窗外部关闭
        document.getElementById('bookModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('deleteModal').addEventListener('click', function (e) {
            if (e.target === this) closeDeleteModal();
        });
    </script>
</body>
</html>
