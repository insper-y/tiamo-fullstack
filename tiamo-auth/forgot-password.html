<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <title>忘记密码 - Tiamo AI 数据管理</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M30 35 L50 25 L70 35 L70 65 L50 75 L30 65 Z' fill='none' stroke='white' stroke-width='4'/><circle cx='50' cy='50' r='8' fill='%2322d3ee'/></svg>">
</head>
<body>
    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">🌙</button>
    <!-- 动态背景 -->
    <div class="ai-bg">
        <div class="grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <canvas id="particles"></canvas>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- 返回登录 -->
            <a href="login.html" class="back-link">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                返回登录
            </a>

            <!-- Logo -->
            <div class="auth-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                    </svg>
                </div>
                <h1>找回密码</h1>
                <p>通过邮箱验证重置您的密码</p>
            </div>

            <!-- 步骤指示器 -->
            <div class="steps">
                <div class="step active">
                    <div class="step-number">1</div>
                    <span class="step-label">验证身份</span>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <span class="step-label">重置密码</span>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <span class="step-label">完成</span>
                </div>
            </div>

            <!-- 提示消息 -->
            <div class="alert" id="alert">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span class="alert-text"></span>
            </div>

            <form class="auth-form" id="forgotForm" novalidate>
                <!-- 步骤1：验证身份 -->
                <div class="step-panel active" id="step1">
                    <!-- 邮箱 -->
                    <div class="form-group">
                        <label class="form-label" for="email">注册邮箱</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            </span>
                            <input type="email" class="form-input" id="email" name="email"
                                   placeholder="请输入注册时的邮箱"
                                   data-required data-rules="required,email" autocomplete="email">
                        </div>
                        <div class="error-message">请输入有效的邮箱地址</div>
                    </div>

                    <!-- 验证码 -->
                    <div class="form-group">
                        <label class="form-label" for="captcha">邮箱验证码</label>
                        <div class="captcha-group">
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
                                </span>
                                <input type="text" class="form-input" id="captcha" name="captcha"
                                       placeholder="6位验证码" maxlength="6"
                                       data-required data-rules="required,captcha" autocomplete="one-time-code">
                            </div>
                            <button type="button" class="captcha-btn"
                                    data-target="#email" data-validate="email"
                                    data-countdown="60" data-original-text="获取验证码">
                                获取验证码
                            </button>
                        </div>
                        <div class="error-message">请输入6位验证码</div>
                    </div>

                    <button type="button" class="btn-submit" data-next-step="1">
                        <span class="btn-text">下一步</span>
                    </button>
                </div>

                <!-- 步骤2：重置密码 -->
                <div class="step-panel" id="step2">
                    <!-- 新密码 -->
                    <div class="form-group">
                        <label class="form-label" for="newPassword">新密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                            </span>
                            <input type="password" class="form-input" id="newPassword" name="newPassword"
                                   placeholder="至少8位，含大小写字母和数字"
                                   data-required data-rules="required,strongPassword"
                                   data-strength="#passwordStrength" autocomplete="new-password">
                            <button type="button" class="toggle-password" aria-label="显示密码">
                                <svg class="eye-open" viewBox="0 0 24 24" style="display:none"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                                <svg class="eye-closed" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
                            </button>
                        </div>
                        <div class="error-message">密码需至少8位，包含大小写字母和数字</div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-bar">
                                <div class="strength-segment"></div>
                                <div class="strength-segment"></div>
                                <div class="strength-segment"></div>
                            </div>
                            <div class="strength-text">密码强度：弱</div>
                        </div>
                    </div>

                    <!-- 确认新密码 -->
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword">确认新密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                            </span>
                            <input type="password" class="form-input" id="confirmPassword" name="confirmPassword"
                                   placeholder="请再次输入新密码"
                                   data-required autocomplete="new-password">
                        </div>
                        <div class="error-message">两次输入的密码不一致</div>
                    </div>

                    <div style="display:flex;gap:12px;">
                        <button type="button" class="btn-submit" data-prev-step="0"
                                style="background:var(--bg-input);border:1px solid var(--border);box-shadow:none;color:var(--text-secondary);flex:1;">
                            <span class="btn-text">上一步</span>
                        </button>
                        <button type="submit" class="btn-submit" style="flex:2;">
                            <span class="btn-text">确认重置</span>
                        </button>
                    </div>
                </div>

                <!-- 步骤3：完成 -->
                <div class="step-panel" id="step3" style="text-align:center;padding:20px 0;">
                    <div style="width:72px;height:72px;margin:0 auto 20px;background:linear-gradient(135deg,var(--success),#059669);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(52,211,153,0.4);">
                        <svg viewBox="0 0 24 24" style="width:36px;height:36px;fill:white;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    </div>
                    <h2 style="font-size:20px;margin-bottom:8px;background:linear-gradient(135deg,var(--text-primary),var(--success));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">密码重置成功</h2>
                    <p style="color:var(--text-secondary);font-size:14px;margin-bottom:28px;">您的密码已成功更新，请使用新密码登录</p>
                    <a href="login.html" class="btn-submit" style="display:inline-block;text-decoration:none;width:auto;padding:14px 48px;">
                        <span class="btn-text">前往登录</span>
                    </a>
                </div>
            </form>

            <div class="copyright">
                &copy; 2026 Tiamo AI. All rights reserved.
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // 主题切换功能
        function toggleTheme() {
            var body = document.body;
            var isLight = body.classList.toggle('light-theme');
            var theme = isLight ? 'light' : 'dark';
            localStorage.setItem('tiamo_theme', theme);
            updateThemeButton(theme);
            var metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
                metaThemeColor.setAttribute('content', isLight ? '#f0f2f5' : '#0a0a1a');
            }
        }

        function updateThemeButton(theme) {
            var btn = document.getElementById('themeToggle');
            if (btn) {
                btn.textContent = theme === 'light' ? '☀️' : '🌙';
                btn.title = theme === 'light' ? '切换到深色模式' : '切换到浅色模式';
            }
        }

        function initTheme() {
            var savedTheme = localStorage.getItem('tiamo_theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                updateThemeButton('light');
                var metaThemeColor = document.querySelector('meta[name="theme-color"]');
                if (metaThemeColor) {
                    metaThemeColor.setAttribute('content', '#f0f2f5');
                }
            } else {
                updateThemeButton('dark');
            }
        }

        var forgotForm = document.getElementById('forgotForm');

        // 步骤1 下一步：验证手机号和验证码
        document.querySelector('[data-next-step="1"]').addEventListener('click', function () {
            var phone = document.getElementById('phone');
            var captcha = document.getElementById('captcha');
            var valid = true;

            if (!AuthUtils.validateField(phone, ['required', 'phone'])) valid = false;
            if (!AuthUtils.validateField(captcha, ['required', 'captcha'])) valid = false;

            if (valid) {
                // 验证码在重置时统一校验，这里先进入下一步
                window.goToStep(1);
            }
        });

        // 步骤2 确认重置密码
        forgotForm.addEventListener('submit', function (e) {
            e.preventDefault();

            var phone = document.getElementById('phone');
            var captcha = document.getElementById('captcha');
            var newPassword = document.getElementById('newPassword');
            var confirmPassword = document.getElementById('confirmPassword');

            var valid = true;
            if (!AuthUtils.validateField(newPassword, ['required', 'strongPassword'])) valid = false;

            if (newPassword.value !== confirmPassword.value) {
                AuthUtils.showError(confirmPassword.closest('.form-group'), '两次输入的密码不一致');
                valid = false;
            }

            if (!valid) return;

            var submitBtn = forgotForm.querySelector('[type="submit"]');
            var originalText = submitBtn.querySelector('.btn-text').textContent;
            AuthUtils.setButtonLoading(submitBtn, true);

            // 调用真实重置密码接口
            Api.resetPassword({
                phone: phone.value.trim(),
                captcha: captcha.value.trim(),
                newPassword: newPassword.value,
                confirmPassword: confirmPassword.value
            }).then(function (res) {
                AuthUtils.setButtonLoading(submitBtn, false, originalText);

                if (res.code === 200) {
                    // 跳转到步骤3（完成）
                    window.goToStep(2);
                } else {
                    AuthUtils.showAlert('error', res.msg || '密码重置失败，请稍后重试');
                    // 如果是验证码错误，回到第一步
                    if (res.msg && res.msg.indexOf('验证码') !== -1) {
                        window.goToStep(0);
                    }
                }
            });
        });

        // 初始化主题
        window.addEventListener('DOMContentLoaded', function () {
            initTheme();
        });
    </script>
</body>
</html>
